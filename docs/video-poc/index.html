<title>WeiterWert Intro-Video PoC</title>
<style>
  /* Local proof of concept, not linked from the site and not deployed (.vercelignore). */
  @font-face{font-family:"Inter";font-weight:400;font-display:block;src:url("../../assets/fonts/inter-latin-400.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Inter";font-weight:600;font-display:block;src:url("../../assets/fonts/inter-latin-600.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Inter";font-weight:800;font-display:block;src:url("../../assets/fonts/inter-latin-800.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Inter";font-weight:400;font-display:block;src:url("../../assets/fonts/inter-latin-ext-400.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"Inter";font-weight:600;font-display:block;src:url("../../assets/fonts/inter-latin-ext-600.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"Inter";font-weight:800;font-display:block;src:url("../../assets/fonts/inter-latin-ext-800.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

  :root{
    --brand-navy:#064E67; --brand-green:#1E7451; --brand-lime:#52973C; --brand-blue:#238EB2; --brand-sun:#FBC131;
    --bg:#F4F7F8; --ink:#16242C; --muted:#55666F; --surface:#FFFFFF; --line:#D3DEE2;
  }
  html,body{margin:0;height:100%;background:#0b1316;overflow:hidden;font-family:"Inter",system-ui,sans-serif;}

  /* 1920x1080 stage, scaled to the window */
  .frame{position:fixed;inset:0;display:grid;place-items:center;}
  .stage{position:relative;width:1920px;height:1080px;background:var(--bg);color:var(--ink);
    transform:scale(var(--k,1));transform-origin:center;overflow:hidden;}

  /* Scene visibility: each scene fades in, holds, fades out. Times in seconds from the start. */
  .scene{position:absolute;inset:0;opacity:0;animation:life var(--len) linear var(--start) both;}
  .scene.last{animation-name:life-end;}
  @keyframes life{0%{opacity:0}1%{opacity:1}96%{opacity:1}100%{opacity:0}}
  @keyframes life-end{0%{opacity:0}1%{opacity:1}100%{opacity:1}}

  /* Entrance for every element: --d is the absolute start time in seconds */
  .in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) var(--d) both;}
  @keyframes in{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .pop{opacity:0;transform:scale(.6);animation:pop .6s cubic-bezier(.2,.9,.3,1.2) var(--d) both;}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .draw{transform:scaleX(0);transform-origin:left center;animation:draw .7s ease-out var(--d) both;}
  @keyframes draw{to{transform:scaleX(1)}}
  .glow{animation:glow 1.6s ease-in-out var(--d) infinite alternate;}
  /* .glow owns the element's animation, so it sits on a child of an .in wrapper */
  @keyframes glow{from{box-shadow:0 0 0 0 rgba(251,193,49,0)}to{box-shadow:0 0 0 18px rgba(251,193,49,.35)}}

  .h1{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:104px;line-height:1.04;letter-spacing:-.02em;color:var(--ink);}
  .h2{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-.015em;color:var(--ink);}
  .eyebrow{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-green);}
  .body{position:absolute;left:0;right:0;margin:0 auto;width:1300px;text-align:center;font-weight:400;font-size:36px;line-height:1.4;color:var(--muted);}
  .label{font-weight:600;font-size:40px;color:var(--ink);text-align:center;}

  /* Scene 1: journey */
  .node{position:absolute;width:150px;height:150px;margin-left:-75px;margin-top:-75px;border-radius:50%;background:var(--surface);
    border:4px solid var(--brand-navy);display:grid;place-items:center;}
  .node.g{border-color:var(--brand-green);}
  .node.l{border-color:var(--brand-lime);}
  .node.s{border-color:var(--brand-sun);}
  .arrow{position:absolute;height:6px;background:var(--brand-blue);border-radius:3px;}
  .node-label{position:absolute;width:320px;margin-left:-160px;text-align:center;font-weight:600;font-size:36px;}

  /* Scene 2: four doors */
  .card{position:absolute;top:360px;width:380px;height:380px;background:var(--surface);border-radius:28px;
    border-top:10px solid var(--brand-navy);box-shadow:0 18px 40px rgba(22,36,44,.10);padding:40px 34px;box-sizing:border-box;}
  .card .tag{font-weight:600;font-size:26px;color:var(--brand-green);margin-bottom:18px;}
  .card .name{font-weight:800;font-size:38px;line-height:1.15;}

  /* Scene 3: five steps */
  .step{position:absolute;top:560px;width:300px;margin-left:-150px;text-align:center;}
  .step .num{width:120px;height:120px;margin:0 auto 24px;border-radius:50%;background:var(--brand-navy);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:56px;}
  .step .name{font-weight:600;font-size:32px;line-height:1.25;}
  .rail{position:absolute;top:620px;height:6px;background:var(--line);}

  /* Scene 4: trust */
  .shield{position:absolute;left:380px;top:300px;width:360px;height:420px;}
  .story{position:absolute;left:1000px;top:560px;width:620px;height:360px;background:var(--surface);border-radius:28px;
    box-shadow:0 18px 40px rgba(22,36,44,.10);display:grid;place-items:center;color:var(--muted);font-size:34px;font-weight:600;}

  /* Scene 5: outro */
  .logo{position:absolute;left:50%;top:170px;width:220px;height:220px;margin-left:-110px;}
  .ctawrap{position:absolute;left:0;right:0;top:760px;text-align:center;}
  .cta{display:inline-block;padding:30px 70px;border-radius:999px;background:var(--brand-navy);
    color:#fff;font-weight:800;font-size:42px;}
  .url{position:absolute;left:0;right:0;top:920px;text-align:center;font-weight:600;font-size:32px;color:var(--muted);}

  .controls{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;font:14px "Inter",system-ui,sans-serif;z-index:5;}
  .controls a,.controls button{background:#16242C;color:#fff;border:0;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer;}
</style>
</head>
<body>
<div class="frame"><div class="stage" id="stage">

  <!-- Szene 1: Gerätsweg, 0–5 s -->
  <section class="scene" style="--start:0s;--len:5s">

      <div class="node pop" style="--d:.3s;left:360px;top:440px"><svg viewBox="0 0 24 24" width="78" height="78" fill="none" stroke="#064E67" stroke-width="1.4" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>
      <div class="arrow draw" style="--d:.9s;left:520px;top:440px;width:200px"></div>

  <!-- Szene 2: vier Wege, 5–10 s -->
  <section class="scene" style="--start:5s;--len:5s">

<div class="controls">
  <a href="?lang=de">DE</a>
  <a href="?lang=tr">TR</a>

<script src="copy.js"></script>
<script>
  // Copy comes from index.html via extract-copy.mjs; no text is typed into the composition.
  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') === 'tr' ? 'tr' : 'de';
  var dict = window.WW_COPY[lang];
  var base = window.WW_COPY.de;
  function t(k){ return dict[k] !== undefined ? dict[k] : base[k]; }
  document.querySelectorAll('[data-k]').forEach(function(el){ el.textContent = t(el.getAttribute('data-k')); });
  document.documentElement.lang = lang;

  // Scale the 1920x1080 stage to the window.
  function fit(){
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('stage').style.setProperty('--k', k);
  }
  fit(); window.addEventListener('resize', fit);

  // ?rec=1 hides the controls, used when recording the MP4.
  if (params.has('rec')) { document.querySelector('.controls').style.display = 'none'; }

  // Replay restarts the CSS timeline.
  document.getElementById('replay').addEventListener('click', function(){ location.reload(); });

  // Preview helper: ?t=12.5 freezes the timeline at that second for screenshots.
  if (params.has('t')) {
    var at = parseFloat(params.get('t')) * 1000;
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = at; });
  }
</script>
